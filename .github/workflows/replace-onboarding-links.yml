name: Replace legacy onboarding links

on:
  push:
    paths:
      - '.github/workflows/replace-onboarding-links.yml'

permissions:
  contents: write

jobs:
  migrate-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace the old production form URL in every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'https://fvautomation.app.n8n.cloud/form/78d36ba3-b1ad-4a13-bf56-f745f0370094'
          live = 'https://fvautomation.app.n8n.cloud/form/02d286c1-a29d-4538-84ce-653c7daddb44'
          files_changed = 0
          links_changed = 0
          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, live), encoding='utf-8')
                  print(f'{path}: updated {count} link(s)')
                  files_changed += 1
                  links_changed += count
          print(f'Updated {links_changed} link(s) in {files_changed} HTML file(s).')
          if not links_changed:
              raise SystemExit('No legacy links found; check the source URL before proceeding.')
          if any(old in p.read_text(encoding='utf-8') for p in Path('.').rglob('*.html')):
              raise SystemExit('A legacy link remains in an HTML file.')
          PY
      - name: Commit the updated pages to main
        shell: bash
        run: |
          git add -u -- '*.html'
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Replace outdated onboarding form links with live production URL'
          git push origin HEAD:main
