name: Lorosae Legends Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [feature/lorosae-legends-game]
    paths:
      - 'games/lorosae-legends/**'
      - '.github/workflows/lorosae-android-debug.yml'
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: games/lorosae-legends
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK from runner image
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Missing Android sdkmanager in runner image: $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify engine
        run: npm test
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build testing APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lorosae-legends-android-debug
          path: games/lorosae-legends/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
