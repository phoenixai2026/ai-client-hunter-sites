<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#143e35">
<title>Tile Garden | WebLorosae Games</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#276858,#102e29 72%);color:#f9f5df;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh}.wrap{max-width:680px;margin:auto;padding:20px 12px 50px}header{text-align:center}h1{font:700 38px Georgia,serif;margin:5px 0}.by{font-size:11px;letter-spacing:.14em;color:#bdd6c3}p{color:#d7e6da}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stats div{padding:11px;background:#ffffff12;border:1px solid #ffffff23;border-radius:15px;text-align:center}.stats b{display:block;font-size:23px}.stats small{font-size:10px;color:#b8d2c4}.boardWrap{background:linear-gradient(135deg,#367763,#163b33);border-radius:20px;padding:14px 5px;box-shadow:0 16px 35px #001b1688}.board{position:relative;aspect-ratio:1.3;margin:auto;max-width:580px}.tile{position:absolute;width:11%;height:13.1%;background:linear-gradient(145deg,#fffef4,#e3dbc2);border:2px solid #fffbea;border-bottom:4px solid #b7ae8a;border-right:3px solid #b7ae8a;border-radius:7px;box-shadow:3px 5px 6px #001b1677;font-size:clamp(17px,5vw,30px);font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}.tile.blocked{filter:brightness(.78)}.tile.selected{outline:3px solid #ffcc61;transform:translateY(-5px)}.tile.hint{outline:3px solid #ffdd59}button{font:inherit}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}.controls button,.mode button{border:0;border-radius:12px;padding:12px 2px;background:#eddfb3;color:#1b493e;font-weight:750;font-size:13px}.controls button:disabled{opacity:.4}.mode{display:flex;gap:8px;margin:12px 0}.mode button{flex:1;background:#ffffff19;color:#e8f5e6;border:1px solid #ffffff44}.mode button.active{background:#eddfb3;color:#1b493e}.message{text-align:center;min-height:46px;padding:15px 3px;font-size:13px;color:#f1e5c2}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;font-size:12px;color:#bbd6c3}.foot button{padding:8px 14px;border-radius:20px;border:1px solid #8bc2a4;background:none;color:#f1e5c2}#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:20px;z-index:100}#modal.show{display:grid}.dialog{background:#f7f4e8;color:#174336;border-radius:21px;padding:27px;text-align:center;max-width:350px}.dialog h2{font:700 29px Georgia,serif}.dialog p{color:#174336;line-height:1.5}.dialog button{border:0;border-radius:12px;background:#176044;color:white;padding:12px 25px}@media(max-width:380px){.tile{font-size:17px;border-radius:5px}.controls button{font-size:11px}}
</style>
</head>
<body><main class="wrap"><header><div class="by">WEBLOROSAE GAMES · PROTOTYPE</div><h1>Tile Garden ✿</h1><p>Relax and match two identical free tiles.</p></header><div class="stats"><div><b id="level">1</b><small>LEVEL</small></div><div><b id="left">64</b><small>TILES LEFT</small></div><div><b id="count">0</b><small>MATCHES</small></div></div><div class="mode"><button id="classic" class="active">✿ Classic</button><button id="daily">☀ Daily challenge</button></div><div class="boardWrap"><div id="board" class="board" aria-label="Mahjong solitaire board"></div></div><div id="message" class="message" role="status">Choose two matching free tiles.</div><div class="controls"><button id="hint">✦ Hint</button><button id="undo">↶ Undo</button><button id="shuffle">⤨ Shuffle</button><button id="restart">↻ Restart</button></div><div class="foot"><span id="progress">Progress saves on this device · No adverts</span><button id="rules">How to play</button></div></main><div id="modal"><div class="dialog"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="close">Continue</button></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),board=$('board'),faces=['🀙','🀚','🀛','🀜','🀝','🀞','🀇','🀈','🀉','🀊','🀅','🀄','🀀','🀁','🀂','🀃'],KEY='tile-garden-weblorosae-v1';
let mode='classic',level=1,tiles=[],selected=null,history=[],moves=0,busy=false,records={};
function today(){let d=new Date;return [d.getFullYear(),d.getMonth()+1,d.getDate()].join('-')}
function hash(s){let h=2166136261;for(let c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function rng(seed){let x=seed>>>0;return ()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
function coords(){let out=[];for(let y=0;y<6;y++)for(let x=0;x<8;x++)out.push({x,y,z:0,id:'b'+x+'-'+y});let layer=mode==='daily'?hash(today())%3:(level-1)%3;for(let y=0;y<6;y++)for(let x=0;x<8;x++)if((layer===0&&y>=1&&y<=4&&x>=2&&x<=5)||(layer===1&&y>=2&&y<=3)||(layer===2&&y>=1&&y<=4&&(x===1||x===2||x===5||x===6)))out.push({x,y,z:1,id:'t'+x+'-'+y});return out}
function free(t,active){if(!active.has(t.id))return false;if(!t.z&&active.has('t'+t.x+'-'+t.y))return false;let prefix=t.z?'t':'b';return !active.has(prefix+(t.x-1)+'-'+t.y)||!active.has(prefix+(t.x+1)+'-'+t.y)}
function make(spots,random){let ri=n=>Math.floor(random()*n);for(let attempt=0;attempt<1200;attempt++){let remain=new Set(spots.map(t=>t.id)),pairs=[];while(remain.size){let open=spots.filter(t=>free(t,remain));if(open.length<2)break;let a=open[ri(open.length)],other=open.filter(t=>t.id!==a.id),b=other[ri(other.length)];pairs.push([a.id,b.id]);remain.delete(a.id);remain.delete(b.id)}if(!remain.size){let vals=pairs.map((_,i)=>i%faces.length);for(let i=vals.length-1;i>0;i--){let j=ri(i+1);[vals[i],vals[j]]=[vals[j],vals[i]]}let map=new Map;pairs.forEach((p,i)=>p.forEach(id=>map.set(id,vals[i])));return map}}throw Error('Board could not be generated')}
function slot(){return mode==='daily'?'daily-'+today():'classic'}
function save(){records[slot()]={level,tiles:tiles.map(({id,face,gone})=>({id,face,gone})),history,moves};try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){}}
function say(text){$('message').textContent=text}
function view(){board.replaceChildren();let active=new Set(tiles.filter(t=>!t.gone).map(t=>t.id));for(let t of tiles){if(t.gone)continue;let el=document.createElement('button'),isFree=free(t,active);el.className='tile'+(isFree?'':' blocked')+(selected===t.id?' selected':'');el.textContent=faces[t.face];el.style.left=(4+t.x*11.4+t.z*.65)+'%';el.style.top=(7.5+t.y*13.7-t.z)+'%';el.style.zIndex=t.z*10+t.y;el.style.color=t.face<=5||t.face===10||t.face===11?'#bf4143':'#25625f';el.setAttribute('aria-label','Mahjong tile '+faces[t.face]+(isFree?' free':' blocked'));el.onclick=()=>choose(t.id);board.appendChild(el);t.el=el}$('left').textContent=tiles.filter(t=>!t.gone).length;$('count').textContent=moves;$('level').textContent=mode==='daily'?'☀':level;$('undo').disabled=!history.length||busy;for(let m of ['classic','daily'])$(m).classList.toggle('active',m===mode)}
function pairs(){let active=new Set(tiles.filter(t=>!t.gone).map(t=>t.id)),open=tiles.filter(t=>free(t,active)),out=[];for(let i=0;i<open.length;i++)for(let j=i+1;j<open.length;j++)if(open[i].face===open[j].face)out.push([open[i],open[j]]);return out}
function reset(){selected=null;history=[];moves=0;busy=false;let spots=coords(),random=mode==='daily'?rng(hash(today()+'tilegarden')):Math.random,map=make(spots,random);tiles=spots.map(t=>({...t,face:map.get(t.id),gone:false}));view();save();say('Choose two matching free tiles.')}
function load(){selected=null;busy=false;let r=records[slot()],spots=coords();if(r&&Array.isArray(r.tiles)&&r.tiles.length===64){level=r.level||1;spots=coords();let map=new Map(r.tiles.map(t=>[t.id,t]));tiles=spots.map(t=>({...t,face:map.get(t.id)?.face??0,gone:!!map.get(t.id)?.gone}));history=r.history||[];moves=r.moves||0;view();say('Progress restored.');return}reset()}
function modal(title,message,label,cb){$('modalTitle').textContent=title;$('modalText').textContent=message;$('close').textContent=label;$('modal').classList.add('show');$('close').onclick=()=>{$('modal').classList.remove('show');cb?.()}}
function choose(id){if(busy)return;let t=tiles.find(t=>t.id===id),active=new Set(tiles.filter(t=>!t.gone).map(t=>t.id));if(!t||!free(t,active)){say('Choose a tile with an open side and no tile above.');return}if(selected===id){selected=null;view();return}if(selected===null){selected=id;view();say('Now choose a matching free tile.');return}let prev=tiles.find(t=>t.id===selected);if(prev.face!==t.face){selected=id;view();say('Not a match. Try another tile.');return}busy=true;history.push([prev.id,t.id]);prev.gone=t.gone=true;moves++;selected=null;busy=false;view();save();if(tiles.every(t=>t.gone)){busy=true;modal('Garden cleared!','Beautiful work. Ready for another puzzle?',mode==='daily'?'Done':'Next level',()=>{if(mode==='classic'){level++;reset()}else say('Come back tomorrow for a new daily challenge.')})}else if(!pairs().length)say('No matches available. Use Shuffle.');else say('Lovely match!')}
$('hint').onclick=()=>{if(busy)return;let pair=pairs()[0];if(!pair){say('No matching free pair. Shuffle to continue.');return}pair.forEach(t=>t.el?.classList.add('hint'));say('The glowing tiles match.')};
$('undo').onclick=()=>{if(busy||!history.length)return;history.pop().forEach(id=>{let t=tiles.find(t=>t.id===id);if(t)t.gone=false});moves--;selected=null;view();save();say('Last move undone.')};
$('shuffle').onclick=()=>{if(busy)return;let rem=tiles.filter(t=>!t.gone);try{let map=make(rem,Math.random);rem.forEach(t=>t.face=map.get(t.id));history=[];selected=null;view();save();say('Remaining tiles reshuffled.') }catch(e){say('Cannot shuffle right now. Try Undo.') }};
$('restart').onclick=()=>modal('Restart?','This replaces the current puzzle.', 'Restart',reset);
$('rules').onclick=()=>modal('How to play','Match two identical tiles. A tile is free if nothing is stacked above it and at least one side is open. Clear every tile. Hints, Undo and Shuffle can help. Progress saves on this browser.','Play');
for(let m of ['classic','daily'])$(m).onclick=()=>{if(mode===m)return;save();mode=m;load()};
try{records=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}load();
})();
</script></body></html>
