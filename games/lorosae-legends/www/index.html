<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#162f49"><meta name="color-scheme" content="dark"><title>Lorosae Legends | WebLorosae Games</title><link rel="stylesheet" href="style.css"></head>
<body><div class="landscape" aria-hidden="true"><div class="sun"></div><div class="ridge ridge-back"></div><div class="ridge ridge-front"></div></div>
<main class="shell"><header class="head"><div class="eyebrow">WEBLOROSAE GAMES PRESENTS</div><h1>Lorosae <span>Legends</span></h1><p class="subtitle">A journey of sunrise, mountains and sea</p></header>
<nav class="switch" aria-label="Game mode"><button id="campaign" class="active" aria-pressed="true">Adventure</button><button id="daily" aria-pressed="false">Daily sunrise</button></nav>
<section class="panel" aria-label="Puzzle"><div class="status"><div><small>LEVEL</small><strong id="level">01 / 50</strong></div><div><small>REMAINING</small><strong id="remaining">18</strong></div><div><small>PROGRESS</small><strong id="progress">0%</strong></div></div>
<div class="board-outer"><div id="board" class="board" role="group" aria-label="Layered tile puzzle"></div></div>
<div class="tray-title"><span>COLLECTION TRAY</span><span id="capacity">0 / 7</span></div><div class="tray" id="tray" role="group" aria-label="Seven slot collection tray"></div><p class="message" id="message" role="status" aria-live="polite">Collect three matching symbols to clear them.</p>
<div class="tools"><button id="hint">✦ <span>Hint</span></button><button id="undo">↶ <span>Undo</span></button><button id="shuffle">⤨ <span>Shuffle</span></button><button id="restart">↻ <span>Restart</span></button></div></section>
<footer><div class="bottom"><button id="achievements">✧ Achievements</button><button id="instructions">ⓘ How to play</button></div><p class="credit">Inspired by Timor-Leste · Original artwork and gameplay · Progress stored on this device</p></footer></main>
<div id="overlay" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="seal">✺</div><h2 id="dialog-title"></h2><p id="dialog-text"></p><div class="dialog-buttons"><button id="dialog-cancel" class="secondary">Cancel</button><button id="dialog-ok">Continue</button></div></section></div>
<script type="module" src="src/game.mjs"></script></body></html>
