<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#0c4d42"><title>Lorosae Legends</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app" class="game-app">
<div class="forest" aria-hidden="true"></div>
<header class="game-header"><button id="back" class="round-button" aria-label="Home">‹</button><div class="score">SUNRISE <b id="score">0</b></div><button id="menu" class="round-button" aria-label="Menu">☰</button></header>
<section class="holding-row" aria-label="Matching selection"><div class="hold-label">MATCH</div><div class="hold-bar"><div id="hold-selected" class="hold-selected" role="status" aria-live="polite">Choose two matching tiles</div></div></section>
<main class="play-area"><div id="board" class="mahjong-board" role="group" aria-label="Mahjong puzzle"></div></main>
<div class="game-bottom"><div class="game-level"><span class="eyebrow">WEBLOROSAE GAMES</span><strong>Level <span id="level">1</span></strong><span id="remaining" class="remaining"></span></div><div class="booster-bar"><button id="shuffle" class="booster" aria-label="Shuffle remaining tiles"><span>⤨</span><small>Shuffle</small></button><button id="hint" class="booster" aria-label="Show matching tiles"><span>✦</span><small>Hint</small></button><button id="undo" class="booster" aria-label="Undo last pair"><span>↶</span><small>Undo</small></button></div><div id="message" class="message" aria-live="polite">Match two free tiles to clear the board.</div></div>
<div class="modal" id="modal" hidden><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-sun">☀</div><h2 id="modal-title"></h2><p id="modal-message"></p><div class="modal-actions"><button id="modal-cancel" class="secondary">Cancel</button><button id="modal-confirm">Continue</button></div></section></div>
</div><script type="module" src="src/game.mjs"></script></body></html>
